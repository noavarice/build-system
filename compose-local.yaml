services:
  repository-proxy:
    build:
      dockerfile: repository-proxy/Dockerfile
      context: .
    container_name: build-repository-proxy-local
    # The `nexus` network alias keeps the existing `NEXUS_HOST=nexus` references and the
    # settings.xml mirror URL (`http://nexus:8081/repository/maven-central`) working unchanged.
    networks:
      default:
        aliases:
          - nexus
    # Serve on the historical Nexus port; the healthcheck (image or compose) reads SERVER_PORT.
    environment:
      SERVER_PORT: 8081
    command:
      - --repository-proxy.repositories.shibboleth=https://build.shibboleth.net/maven/releases
    volumes:
      - repository-proxy-local-repo:/home/repositoryproxy/.m2/repository
    ports:
      - 127.0.0.1:8081:8081
    # Compose declares the check explicitly because podman-compose builds OCI images, which ignore
    # the Dockerfile HEALTHCHECK (the image ships the same /usr/local/bin/healthcheck).
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges
  maven:
    image: docker.io/library/maven:3.9.11-eclipse-temurin-21
    container_name: build-maven-local
    command: mvn clean install
    configs:
      - source: settings.xml
        target: /root/.m2/settings.xml
    environment:
      NEXUS_HOST: nexus
    networks:
      - default
    volumes:
      - ./:/usr/src/build-system
      - maven-local-repo:/root/.m2/repository
    working_dir: /usr/src/build-system
    security_opt:
      - no-new-privileges
    depends_on:
      repository-proxy:
        condition: service_healthy
  build-itself:
    build:
      dockerfile: build-itself/Dockerfile
      context: .
    container_name: build-itself
    environment:
      NEXUS_HOST: nexus
    volumes:
      - ./:/app
      - maven-local-repo:/m2/repository
    security_opt:
      - no-new-privileges
    networks:
      - default
    depends_on:
      repository-proxy:
        condition: service_healthy
  build-spring-security:
    # Rebuilds the spring-security git submodule with BuildSpringSecurity. The image embeds the
    # module `target/` jars (Maven layout), so run `mvn clean install` (e.g. the `maven` service or
    # `podman compose build` after a host `mvn package`) before building this image. Requires the
    # `spring-security` submodule checkout (`git submodule update --init spring-security`).
    build:
      dockerfile: build-spring-security/Dockerfile
      context: .
    container_name: build-spring-security
    environment:
      NEXUS_HOST: nexus
    volumes:
      - ./:/app
      - maven-local-repo:/m2/repository
    security_opt:
      - no-new-privileges
    networks:
      - default
    depends_on:
      repository-proxy:
        condition: service_healthy
  jdtls:
    build:
      context: jdtls
      dockerfile: Dockerfile
    image: build-system-jdtls:latest
    container_name: build-jdtls-local
    # Mount the workspace at its host path so the file URIs opencode sends
    # resolve to the same files inside the container.
    working_dir: ${PWD}
    environment:
      NEXUS_HOST: nexus
    configs:
      - source: settings.xml
        target: /root/.m2/settings.xml
    volumes:
      - ${PWD}:${PWD}
      - jdtls-data:/root/.cache/jdtls
      - jdtls-m2:/root/.m2/repository
    command: ["sleep", "infinity"]
    security_opt:
      - no-new-privileges
    networks:
      - default
    depends_on:
      repository-proxy:
        condition: service_healthy

configs:
  settings.xml:
    # language=XML
    content: |
      <settings>
        <mirrors>
          <mirror>
            <id>nexus</id>
            <name>Nexus</name>
            <url>http://nexus:8081/repository/maven-central</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>

volumes:
  jdtls-data:
  jdtls-m2:
  maven-local-repo:
  repository-proxy-local-repo:

networks:
  default:
    driver: bridge
