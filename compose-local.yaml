services:
  nexus:
    image: sonatype/nexus3:3.82.0-alpine
    container_name: build-nexus-local
    networks:
      - default
    volumes:
      - nexus-data:/nexus-data
    security_opt:
      - no-new-privileges
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/service/rest/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  nexus-init:
    image: alpine:3.20
    container_name: build-nexus-init
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-admin123}
    volumes:
      - nexus-data:/nexus-data:ro
      - ./scripts/nexus-init.sh:/nexus-init.sh:ro
    entrypoint:
      - sh
      - -c
      - apk add --no-cache curl jq >/dev/null && sh /nexus-init.sh
    networks:
      - default
    restart: "no"
  maven:
    image: maven:3.9.11-eclipse-temurin-21
    container_name: build-maven-local
    command: mvn clean install
    configs:
      - source: settings.xml
        target: /root/.m2/settings.xml
    environment:
      NEXUS_HOST: nexus
    networks:
      - default
    volumes:
      - ./:/usr/src/build-system
    working_dir: /usr/src/build-system
    security_opt:
      - no-new-privileges
    depends_on:
      nexus-init:
        condition: service_completed_successfully
  build-itself:
    build:
      dockerfile: build-itself/Dockerfile
      context: .
    container_name: build-itself
    environment:
      NEXUS_HOST: nexus
    volumes:
      - ./:/app
    security_opt:
      - no-new-privileges
    networks:
      - default
    depends_on:
      nexus-init:
        condition: service_completed_successfully
  jdtls:
    build:
      context: jdtls
      dockerfile: Dockerfile
    image: build-system-jdtls:latest
    container_name: build-jdtls-local
    # Mount the workspace at its host path so the file URIs opencode sends
    # resolve to the same files inside the container.
    working_dir: ${PWD}
    environment:
      NEXUS_HOST: nexus
    configs:
      - source: settings.xml
        target: /root/.m2/settings.xml
    volumes:
      - ${PWD}:${PWD}
      - jdtls-data:/root/.cache/jdtls
      - jdtls-m2:/root/.m2/repository
    command: ["sleep", "infinity"]
    security_opt:
      - no-new-privileges
    networks:
      - default
    depends_on:
      nexus-init:
        condition: service_completed_successfully

configs:
  settings.xml:
    # language=XML
    content: |
      <settings>
        <mirrors>
          <mirror>
            <id>nexus</id>
            <name>Nexus</name>
            <url>http://nexus:8081/repository/maven-central</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>

volumes:
  nexus-data:
  jdtls-data:
  jdtls-m2:

networks:
  default:
    driver: bridge
